name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  APP_NAME: LanFileTransfer-Go

jobs:
  # ---------------------------------------------------------------------
  # Frontend: type check + production bundle.
  # Produces frontend/dist, which the Go job needs because main.go embeds it
  # via `//go:embed all:frontend/dist`.
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lanfileTransfer-go/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: lanfileTransfer-go/frontend/package-lock.json

      - name: Verify lockfile is in sync with package.json
        run: npm ci

      - name: Type check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Verify bundle was produced
        run: test -f dist/index.html

      - name: Upload dist for the Go job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: lanfileTransfer-go/frontend/dist
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Go: gofmt gate, go vet, unit tests with the race detector.
  # ---------------------------------------------------------------------
  backend:
    name: Go (fmt + vet + test -race)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: lanfileTransfer-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: lanfileTransfer-go/go.sum

      - name: Restore embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: lanfileTransfer-go/frontend/dist

      # The embed directive makes every Go command fail when the directory is
      # absent, so prove the guard target works before relying on it.
      - name: Ensure frontend/dist exists
        run: make ensure-dist

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: Unit tests (race detector)
        run: make test

  # ---------------------------------------------------------------------
  # C daemon: build, then smoke-test the binary.
  # ---------------------------------------------------------------------
  c-daemon:
    name: C daemon (make + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lanfileTransfer-c
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make clean && make 2>&1 | tee /tmp/build.log

      - name: Assert no build errors
        run: '! grep -qE "(^|:) error:" /tmp/build.log'

      - name: Smoke test --version
        run: ./bin/lanfileTransfer-c --version

      # Foreground mode binds UDP/TCP 9876 and then blocks on the interactive
      # CLI reading stdin. Hold stdin open with a FIFO so the process really is
      # parked in fgets, then send SIGTERM and require a prompt clean exit.
      #
      # -s KILL bounds the test: if a regression makes shutdown hang again
      # (pthread_join on a thread blocked in accept()), the job fails in 15s
      # instead of burning the whole timeout budget.
      - name: Smoke test -- SIGTERM shutdown
        run: |
          set -euo pipefail
          rm -rf /tmp/lft-ci /tmp/lft-ci.log /tmp/lft-ci.out /tmp/lft-fifo
          mkfifo /tmp/lft-fifo

          timeout -s KILL 15 ./bin/lanfileTransfer-c \
            -f -d ci-smoke-test -n ci-smoke \
            -s /tmp/lft-ci -l /tmp/lft-ci.log \
            < /tmp/lft-fifo > /tmp/lft-ci.out 2>&1 &
          PID=$!
          sleep 30 > /tmp/lft-fifo &   # keep stdin open
          HOLDER=$!

          for _ in $(seq 1 50); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 0.1
          done
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "daemon exited before it could be signalled"
            cat /tmp/lft-ci.out
            exit 1
          fi

          # It must be parked reading stdin, not spinning or deadlocked.
          MAIN_TID=$(ls /proc/"$PID"/task | head -1)
          echo "main thread wchan: $(cat /proc/"$PID"/task/"$MAIN_TID"/wchan)"

          kill -TERM "$PID"

          EXITED=no
          for _ in $(seq 1 100); do
            if ! kill -0 "$PID" 2>/dev/null; then EXITED=yes; break; fi
            sleep 0.1
          done
          kill -9 "$HOLDER" 2>/dev/null || true

          if [ "$EXITED" != "yes" ]; then
            echo "FAIL: SIGTERM did not stop the daemon within 10s"
            echo "main thread syscall: $(cut -d' ' -f1 /proc/"$PID"/syscall 2>/dev/null)"
            cat /tmp/lft-ci.out
            exit 1
          fi

          echo "--- captured output ---"
          cat /tmp/lft-ci.out

          # Deterministic assertions only. The auth token is generated once and
          # reused afterwards, so its log line only appears on a fresh machine --
          # check the file instead.
          grep -q 'TCP 服务器已启动' /tmp/lft-ci.out
          grep -q '已停止'            /tmp/lft-ci.out
          test -s "$HOME/.lanfiletransfer.token"
          echo "all C daemon smoke assertions passed"

      - name: Cleanup
        if: always()
        run: |
          pkill -9 -f lanfileTransfer-c 2>/dev/null || true
          rm -rf /tmp/lft-ci /tmp/lft-ci.log /tmp/lft-ci.out /tmp/lft-fifo /tmp/build.log

  # ---------------------------------------------------------------------
  # Cross-platform desktop builds. This is the only job that exercises the
  # full Wails pipeline end to end.
  # ---------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows/amd64
            goos: windows
            goarch: amd64
            artifact: ${{ env.APP_NAME }}-windows-amd64.exe
          - os: macos-latest
            label: darwin/universal
            goos: darwin
            goarch: arm64
            artifact: ${{ env.APP_NAME }}-macos
          - os: ubuntu-latest
            label: linux/amd64
            goos: linux
            goarch: amd64
            artifact: ${{ env.APP_NAME }}-linux-amd64
    defaults:
      run:
        working-directory: lanfileTransfer-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: lanfileTransfer-go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: lanfileTransfer-go/frontend/package-lock.json

      - name: Install Linux GUI/WebKit build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Cache Wails CLI
        id: wails-cache
        shell: bash
        run: |
          echo "dir=$(go env GOPATH)/bin" >> "$GITHUB_OUTPUT"
          echo "key=wails-${{ runner.os }}-${{ hashFiles('lanfileTransfer-go/go.sum') }}"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.wails-cache.outputs.dir }}
          key: ${{ steps.wails-cache.outputs.key }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build desktop app
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: wails build -clean

      - name: Assert binary exists
        shell: bash
        run: |
          set -e
          found=$(find build/bin -type f \( -name 'LanFileTransfer-Go*' -o -name '*.app' \) | head -n 1)
          if [ -z "$found" ]; then
            echo "no build output found under build/bin:"
            ls -R build/bin || true
            exit 1
          fi
          echo "built: $found"
          du -h "$found" || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: lanfileTransfer-go/build/bin/${{ env.APP_NAME }}*
          retention-days: 14
          if-no-files-found: error
